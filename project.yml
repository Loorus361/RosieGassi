name: RosieGassi
options:
  bundleIdPrefix: de.carlosanderssohn
  deploymentTarget:
    iOS: '26.0'
  developmentLanguage: de
packages:
  RosieCore:
    path: RosieCore
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '13'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  RosieGassi:
    type: application
    platform: iOS
    sources: [RosieGassi]
    info:
      path: RosieGassi/Info.plist
      properties:
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [location]
        CFBundleURLTypes:
          - CFBundleURLName: de.carlosanderssohn.RosieGassi
            CFBundleURLSchemes: [rosiegassi]
        NSLocationWhenInUseUsageDescription: Rosie Gassi nutzt den Standort nach deiner Einwilligung für die GPS-Route einer gestarteten Runde und, wenn du es festlegst, für den Wetter-Ort Zuhause. Koordinaten fürs Wetter gehen an Open-Meteo.
    dependencies:
      - package: RosieCore
      - target: RosieGassiLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.carlosanderssohn.RosieGassi
        INFOPLIST_KEY_CFBundleDisplayName: Rosie Gassi

        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  RosieGassiLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - RosieGassiLiveActivity
      - RosieGassi/LiveActivityShared
    info:
      path: RosieGassiLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Rosie Gassi Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.carlosanderssohn.RosieGassi.LiveActivity
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  RosieGassi:
    build:
      targets:
        RosieGassi: all
        RosieGassiLiveActivity: all
